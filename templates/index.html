<!doctype html>
<html lang="ko"{% if app_mode %} class="app"{% endif %}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="window">
    <!-- 창으로 열면 제목 글자 줄을 잡고 끌 수 있음 (pywebview-drag-region) -->
    <div class="titlebar">
      <h1 class="pywebview-drag-region">{{ title }}</h1>
      <div class="caption">
        <button id="win-min" class="min" aria-label="최소화"></button>
        <button id="win-max" class="max" aria-label="최대화"></button>
        <button id="win-close" class="close" aria-label="닫기"></button>
      </div>
    </div>

    <div class="content">
      <section>
        <h2>읽을 문장을 입력하세요</h2>
        <textarea id="text" rows="3" maxlength="{{ max_len }}" autofocus></textarea>
        <div class="row">
          <span class="note"><span id="count">0</span>/{{ max_len }}자 · Ctrl + Enter</span>
          <button id="make" class="btn default">발음 파일 만들기(<u>M</u>)</button>
        </div>
      </section>

      <p id="status" class="status"></p>

      <section id="result" hidden>
        <h2>발음</h2>
        <p id="pron" class="pron"></p>

        <div id="player" class="player">
          <button id="play" class="orb" aria-label="재생">
            <svg class="play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg class="pause" viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
          </button>
          <div id="seek" class="seek"><div></div></div>
          <span id="time" class="time">0:00 / 0:00</span>
          <a id="save" class="btn" download>wav 저장(<u>S</u>)</a>
        </div>
        <p id="empty" class="note" hidden>한글이 없어서 만들 소리가 없어요.</p>
      </section>
    </div>
  </main>

  <audio id="audio"></audio>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
